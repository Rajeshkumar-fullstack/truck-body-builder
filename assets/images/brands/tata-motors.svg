<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" aria-label="Tata Motors Logo">
  <!-- Tata Dual Swoosh Ring Emblem -->
  <g transform="translate(10, 6)">
    <!-- Outer Oval Ring -->
    <ellipse cx="24" cy="24" rx="23" ry="20" fill="none" stroke="#005A9C" stroke-width="3.5" />
    <!-- Iconic stylized arch 'T' -->
    <path d="M 12,32 C 14,24 20,13 24,13 C 28,13 34,24 36,32 C 34,26 28,19 24,19 C 20,19 14,26 12,32 Z" fill="#005A9C" />
    <path d="M 18,34 C 21,27 23,20 24,20 C 25,20 27,27 30,34 C 27,30 25,26 24,26 C 23,26 21,30 18,34 Z" fill="#0072CE" />
  </g>
  <!-- Brand Typography -->
  <g transform="translate(68, 12)">
    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="20" letter-spacing="4" fill="currentColor">TATA</text>
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="5.5" fill="#005A9C">MOTORS</text>
  </g>
</svg>
