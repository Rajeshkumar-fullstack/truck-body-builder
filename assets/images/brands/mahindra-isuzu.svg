<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" width="260" height="60" aria-label="Mahindra and Isuzu Logos">
  <!-- Mahindra Section -->
  <g transform="translate(6, 12)">
    <!-- Stylized Mahindra Twin Peaks Emblem -->
    <path d="M 2,28 C 6,18 12,8 17,2 C 20,9 22,17 24,24 C 26,17 28,9 31,2 C 36,8 42,18 46,28 C 39,26 33,25 24,25 C 15,25 9,26 2,28 Z" fill="#D32F2F" />
  </g>
  <text x="58" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="12.5" letter-spacing="1" fill="currentColor">MAHINDRA</text>

  <!-- Divider -->
  <line x1="140" y1="12" x2="140" y2="48" stroke="#D1D5DB" stroke-width="1.5" />

  <!-- Isuzu Section -->
  <g transform="translate(150, 16)">
    <!-- Red block / Twin pillar motif -->
    <rect x="2" y="2" width="7" height="24" rx="2" fill="#E51A24" />
    <rect x="13" y="2" width="7" height="24" rx="2" fill="#E51A24" />
  </g>
  <text x="178" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="17" letter-spacing="2.5" fill="#E51A24">ISUZU</text>
</svg>
