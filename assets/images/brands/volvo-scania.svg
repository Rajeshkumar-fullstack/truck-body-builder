<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" width="260" height="60" aria-label="Volvo and Scania Logos">
  <!-- Volvo Iron Mark Section -->
  <g transform="translate(6, 9)">
    <!-- Iron mark ring -->
    <circle cx="21" cy="21" r="17" fill="none" stroke="#003057" stroke-width="3.5" />
    <!-- Arrow pointing northeast -->
    <path d="M 31,11 L 41,1 L 34,1 M 41,1 L 41,8" fill="none" stroke="#003057" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Center blue bar -->
    <rect x="3" y="16.5" width="36" height="9" fill="#003057" rx="1.5" />
    <text x="21" y="23.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="7" letter-spacing="1" fill="#FFFFFF" text-anchor="middle">VOLVO</text>
  </g>
  <text x="64" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" letter-spacing="1.5" fill="currentColor">VOLVO</text>

  <!-- Divider -->
  <line x1="135" y1="12" x2="135" y2="48" stroke="#D1D5DB" stroke-width="1.5" />

  <!-- Scania Crowned Griffin Section -->
  <g transform="translate(148, 9)">
    <circle cx="21" cy="21" r="18" fill="#041E42" />
    <!-- Stylized Crown -->
    <polygon points="12,18 16,11 21,15 26,11 30,18" fill="#EAAA00" />
    <circle cx="21" cy="25" r="4" fill="#D50000" />
  </g>
  <text x="195" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" letter-spacing="1.5" fill="currentColor">SCANIA</text>
</svg>
