<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <!-- Mirror Specular Chrome Gradient -->
    <linearGradient id="compChromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#F1F5F9" />
      <stop offset="45%" stop-color="#94A3B8" />
      <stop offset="55%" stop-color="#475569" />
      <stop offset="72%" stop-color="#CBD5E1" />
      <stop offset="85%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Deep Titanium Steel Gradient -->
    <linearGradient id="compSteelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#243447" />
      <stop offset="50%" stop-color="#141E28" />
      <stop offset="100%" stop-color="#080D12" />
    </linearGradient>

    <!-- Molten Industrial Orange Gradient -->
    <linearGradient id="compOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE3CC" />
      <stop offset="30%" stop-color="#FFA866" />
      <stop offset="65%" stop-color="#F07824" />
      <stop offset="100%" stop-color="#C24F00" />
    </linearGradient>

    <!-- Drop Shadow for 3D Pop -->
    <filter id="compDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <filter id="compOrangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#F07824" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Base Plate: 3D Heavy Titanium Industrial Shield -->
  <rect x="3" y="3" width="74" height="74" rx="18" fill="url(#compSteelGrad)" stroke="url(#compChromeGrad)" stroke-width="2.6" filter="url(#compDropShadow)" />
  
  <!-- Glowing Molten Orange Inner Rim -->
  <rect x="7" y="7" width="66" height="66" rx="14" fill="none" stroke="url(#compOrangeGrad)" stroke-width="1.8" opacity="0.95" filter="url(#compOrangeGlow)" />

  <!-- Industrial Gear Watermark -->
  <circle cx="40" cy="40" r="28" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="7 4" fill="none" opacity="0.18" />
  <circle cx="40" cy="40" r="23" stroke="#F07824" stroke-width="1" fill="none" opacity="0.4" />

  <!-- Heavy Truck Silhouette and Monogram -->
  <g transform="translate(8, 14) scale(1.05)">
    <!-- Aerodynamic Speed Line & Chassis Foundation -->
    <path d="M 2 41 L 58 41" stroke="url(#compOrangeGrad)" stroke-width="3.2" stroke-linecap="round" />
    <path d="M 12 45 L 48 45" stroke="url(#compChromeGrad)" stroke-width="1.6" stroke-linecap="round" opacity="0.85" />

    <!-- Heavy Tipper Body with Laser-Cut Ribs -->
    <path d="M 4 12 L 35 12 L 35 37 L 4 37 Z" fill="url(#compChromeGrad)" />
    <line x1="12" y1="14" x2="12" y2="35" stroke="#141E28" stroke-width="1.8" />
    <line x1="20" y1="14" x2="20" y2="35" stroke="#141E28" stroke-width="1.8" />
    <line x1="28" y1="14" x2="28" y2="35" stroke="#141E28" stroke-width="1.8" />

    <!-- Commercial Cab-Over Unit -->
    <path d="M 37 17 L 47 17 L 56 26 L 56 37 L 37 37 Z" fill="url(#compChromeGrad)" />
    <!-- Orange Visor -->
    <path d="M 45 14 L 57 22" stroke="url(#compOrangeGrad)" stroke-width="2.6" stroke-linecap="round" />
    <!-- Tinted Cockpit -->
    <polygon points="39,20 46,20 52,26 39,26" fill="#0E1620" />

    <!-- Heavy Axles with Orange Hubs -->
    <circle cx="14" cy="38" r="6" fill="#080D12" stroke="url(#compChromeGrad)" stroke-width="2" />
    <circle cx="14" cy="38" r="2.4" fill="url(#compOrangeGrad)" />

    <circle cx="26" cy="38" r="6" fill="#080D12" stroke="url(#compChromeGrad)" stroke-width="2" />
    <circle cx="26" cy="38" r="2.4" fill="url(#compOrangeGrad)" />

    <circle cx="49" cy="38" r="6" fill="#080D12" stroke="url(#compChromeGrad)" stroke-width="2" />
    <circle cx="49" cy="38" r="2.4" fill="url(#compOrangeGrad)" />
  </g>
</svg>
