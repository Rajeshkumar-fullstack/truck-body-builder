<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <!-- Metallic Chrome Gradient -->
    <linearGradient id="compChromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="70%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Deep Industrial Steel Gradient -->
    <linearGradient id="compSteelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#223244" />
      <stop offset="50%" stop-color="#17232F" />
      <stop offset="100%" stop-color="#0E1720" />
    </linearGradient>

    <!-- Industrial Orange Gradient -->
    <linearGradient id="compOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA866" />
      <stop offset="45%" stop-color="#F07824" />
      <stop offset="100%" stop-color="#C24F00" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="compGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Rounded Industrial Shield -->
  <rect x="3" y="3" width="74" height="74" rx="16" fill="url(#compSteelGrad)" stroke="url(#compChromeGrad)" stroke-width="2" filter="url(#compGlow)" />
  
  <!-- Inner Precision Rim -->
  <rect x="6" y="6" width="68" height="68" rx="13" fill="none" stroke="url(#compOrangeGrad)" stroke-width="1.5" opacity="0.85" />

  <!-- Industrial Gear Segments in Background -->
  <g opacity="0.22" stroke="#FFFFFF" stroke-width="2" fill="none">
    <circle cx="40" cy="40" r="26" stroke-dasharray="6 4" />
  </g>

  <!-- Commercial Heavy-Duty Truck Silhouette -->
  <g transform="translate(10, 15)">
    <!-- Aerodynamic Speed Line / Chassis Foundation -->
    <path d="M 4 41 L 56 41" stroke="url(#compOrangeGrad)" stroke-width="3" stroke-linecap="round" />
    <path d="M 12 45 L 48 45" stroke="url(#compChromeGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.75" />

    <!-- Commercial Tipper / Cargo Body + Cab Silhouette -->
    <!-- Cargo Box Structure with Structural Ribs -->
    <path d="M 5 12 L 35 12 L 35 37 L 5 37 Z" fill="url(#compChromeGrad)" />
    <!-- Tipper Ribs -->
    <line x1="12" y1="14" x2="12" y2="35" stroke="#17232F" stroke-width="1.5" />
    <line x1="20" y1="14" x2="20" y2="35" stroke="#17232F" stroke-width="1.5" />
    <line x1="28" y1="14" x2="28" y2="35" stroke="#17232F" stroke-width="1.5" />

    <!-- Commercial Cab-Over Head -->
    <path d="M 37 17 L 46 17 L 53 26 L 53 37 L 37 37 Z" fill="url(#compChromeGrad)" />
    <!-- Cab Sun Visor Accent -->
    <path d="M 44 15 L 54 22" stroke="url(#compOrangeGrad)" stroke-width="2" stroke-linecap="round" />
    <!-- Windshield Window -->
    <polygon points="39,20 45,20 50,26 39,26" fill="#17232F" />

    <!-- Wheels (Dual Axles) -->
    <!-- Rear Dual Axle -->
    <circle cx="15" cy="38" r="6" fill="#0E1720" stroke="url(#compChromeGrad)" stroke-width="2" />
    <circle cx="15" cy="38" r="2.5" fill="url(#compOrangeGrad)" />
    <circle cx="27" cy="38" r="6" fill="#0E1720" stroke="url(#compChromeGrad)" stroke-width="2" />
    <circle cx="27" cy="38" r="2.5" fill="url(#compOrangeGrad)" />

    <!-- Front Steer Axle -->
    <circle cx="47" cy="38" r="6" fill="#0E1720" stroke="url(#compChromeGrad)" stroke-width="2" />
    <circle cx="47" cy="38" r="2.5" fill="url(#compOrangeGrad)" />
  </g>
</svg>