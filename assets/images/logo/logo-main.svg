<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 76" width="500" height="76">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&amp;family=Montserrat:wght@700;800;900&amp;display=swap');
      .brand-title-metal { font-family: 'Outfit', 'Montserrat', 'Segoe UI', Arial, sans-serif; font-weight: 900; font-size: 28px; letter-spacing: 1px; fill: url(#mainChromeGrad); }
      .brand-title-orange { font-family: 'Outfit', 'Montserrat', sans-serif; font-weight: 900; font-size: 30px; letter-spacing: 1.5px; fill: url(#mainOrangeGrad); filter: drop-shadow(0 0 8px rgba(240, 120, 36, 0.45)); }
      .brand-tagline { font-family: 'Montserrat', 'Segoe UI', sans-serif; font-weight: 800; font-size: 9.5px; letter-spacing: 3.2px; fill: #A0AEC0; }
    </style>

    <!-- Metallic Chrome Specular Gradient -->
    <linearGradient id="mainChromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="18%" stop-color="#F1F5F9" />
      <stop offset="42%" stop-color="#94A3B8" />
      <stop offset="52%" stop-color="#475569" />
      <stop offset="68%" stop-color="#CBD5E1" />
      <stop offset="85%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Deep Industrial Steel Gradient -->
    <linearGradient id="mainSteelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#243447" />
      <stop offset="50%" stop-color="#17232F" />
      <stop offset="100%" stop-color="#0B1117" />
    </linearGradient>

    <!-- Industrial Molten Orange Gradient -->
    <linearGradient id="mainOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE3CC" />
      <stop offset="25%" stop-color="#FFA866" />
      <stop offset="55%" stop-color="#F07824" />
      <stop offset="85%" stop-color="#C24F00" />
      <stop offset="100%" stop-color="#FFA866" />
    </linearGradient>

    <!-- Drop Shadow Filter for Depth -->
    <filter id="mainEmblemShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- ==================== EMBLEM (LEFT) ==================== -->
  <g transform="translate(6, 6)">
    <!-- Outer Rounded Industrial Shield -->
    <rect x="0" y="0" width="64" height="64" rx="15" fill="url(#mainSteelGrad)" stroke="url(#mainChromeGrad)" stroke-width="2" filter="url(#mainEmblemShadow)" />
    
    <!-- Inner Precision Orange Accent Rim -->
    <rect x="3.5" y="3.5" width="57" height="57" rx="12" fill="none" stroke="url(#mainOrangeGrad)" stroke-width="1.4" opacity="0.9" />

    <!-- Industrial Gear Cog Segment Watermark -->
    <g opacity="0.25" stroke="#FFFFFF" stroke-width="1.8" fill="none">
      <circle cx="32" cy="32" r="23" stroke-dasharray="6 3.5" stroke-linecap="round" />
      <circle cx="32" cy="32" r="19" stroke-width="1" stroke="#F07824" opacity="0.6" />
    </g>

    <!-- Commercial Heavy-Duty Truck Silhouette -->
    <g transform="translate(6.5, 12) scale(0.9)">
      <!-- Aerodynamic Speed Line / Chassis Foundation -->
      <path d="M 2 41 L 55 41" stroke="url(#mainOrangeGrad)" stroke-width="2.8" stroke-linecap="round" />
      <path d="M 10 45 L 46 45" stroke="url(#mainChromeGrad)" stroke-width="1.4" stroke-linecap="round" opacity="0.8" />

      <!-- Heavy Commercial Tipper Cargo Box with Vertical Ribs -->
      <path d="M 4 12 L 34 12 L 34 37 L 4 37 Z" fill="url(#mainChromeGrad)" />
      <!-- Structural Stiffener Ribs -->
      <line x1="11" y1="14" x2="11" y2="35" stroke="#17232F" stroke-width="1.6" />
      <line x1="19" y1="14" x2="19" y2="35" stroke="#17232F" stroke-width="1.6" />
      <line x1="27" y1="14" x2="27" y2="35" stroke="#17232F" stroke-width="1.6" />

      <!-- Commercial Cab-Over Head Unit -->
      <path d="M 36 17 L 45 17 L 53 26 L 53 37 L 36 37 Z" fill="url(#mainChromeGrad)" />
      <!-- Sun Visor Deflector -->
      <path d="M 43 14 L 54 22" stroke="url(#mainOrangeGrad)" stroke-width="2" stroke-linecap="round" />
      <!-- Cab Window Tint -->
      <polygon points="38,20 44,20 50,26 38,26" fill="#17232F" />

      <!-- Heavy Axles (Dual Rear Tandem + Front Steer) -->
      <circle cx="13" cy="38" r="6" fill="#0B1117" stroke="url(#mainChromeGrad)" stroke-width="1.8" />
      <circle cx="13" cy="38" r="2.4" fill="url(#mainOrangeGrad)" />
      <circle cx="25" cy="38" r="6" fill="#0B1117" stroke="url(#mainChromeGrad)" stroke-width="1.8" />
      <circle cx="25" cy="38" r="2.4" fill="url(#mainOrangeGrad)" />
      <circle cx="47" cy="38" r="6" fill="#0B1117" stroke="url(#mainChromeGrad)" stroke-width="1.8" />
      <circle cx="47" cy="38" r="2.4" fill="url(#mainOrangeGrad)" />
    </g>
  </g>

  <!-- ==================== TYPOGRAPHY (RIGHT) ==================== -->
  <g transform="translate(86, 0)">
    <!-- Primary Brand Title: TRUCK BODY BUILDER -->
    <text x="0" y="41">
      <tspan class="brand-title-metal">TRUCK BODY </tspan>
      <tspan class="brand-title-orange">BUILDER</tspan>
    </text>

    <!-- Tagline: BUILD • FABRICATE • DELIVER -->
    <g transform="translate(2, 58)">
      <text x="0" y="0" class="brand-tagline">
        BUILD <tspan fill="#F07824" font-weight="900">•</tspan> FABRICATE <tspan fill="#F07824" font-weight="900">•</tspan> DELIVER
      </text>

      <!-- Precision Orange Speed Micro-Bar -->
      <line x1="238" y1="-3" x2="356" y2="-3" stroke="url(#mainOrangeGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.9" />
    </g>
  </g>
</svg>