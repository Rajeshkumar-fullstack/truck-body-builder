<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Ultra-Specular Chrome 3D Gradient -->
    <linearGradient id="specularChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#E2E8F0" />
      <stop offset="40%" stop-color="#64748B" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="55%" stop-color="#94A3B8" />
      <stop offset="80%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Liquid Industrial Orange Chrome -->
    <linearGradient id="moltenOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2E5" />
      <stop offset="25%" stop-color="#FFA866" />
      <stop offset="50%" stop-color="#F07824" />
      <stop offset="60%" stop-color="#B84E00" />
      <stop offset="85%" stop-color="#FF9347" />
      <stop offset="100%" stop-color="#FFF5EB" />
    </linearGradient>

    <!-- Beveled Dark Chassis Steel -->
    <radialGradient id="darkChassisCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#243447" />
      <stop offset="70%" stop-color="#17232F" />
      <stop offset="100%" stop-color="#0A0F14" />
    </radialGradient>

    <!-- 3D Specular Filter -->
    <filter id="specular3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="25" flood-color="#F07824" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Glow & Industrial Halo -->
  <circle cx="250" cy="250" r="230" fill="url(#darkChassisCore)" filter="url(#specular3d)" />

  <!-- Outer Precision Gear Cog Wheel (16 Teeth) -->
  <g stroke="url(#specularChrome)" stroke-width="3" fill="none" opacity="0.6">
    <circle cx="250" cy="250" r="215" stroke-dasharray="24 18" stroke-linecap="round" />
    <circle cx="250" cy="250" r="200" stroke-width="1.5" stroke="#F07824" opacity="0.8" />
  </g>

  <!-- Heavy Beveled Shield Hexagon -->
  <polygon points="250,55 425,150 425,350 250,445 75,350 75,150"
           fill="url(#darkChassisCore)"
           stroke="url(#specularChrome)"
           stroke-width="7" />

  <!-- Inner Molten Orange Racing Border -->
  <polygon points="250,72 408,158 408,342 250,428 92,342 92,158"
           fill="none"
           stroke="url(#moltenOrange)"
           stroke-width="3.5"
           opacity="0.9" />

  <!-- Commercial Heavy Hauler Truck & Custom Body 3D Silhouette -->
  <g transform="translate(105, 140) scale(1.85)">
    <!-- High-Speed Highway Ground Track -->
    <path d="M 0 100 L 160 100" stroke="url(#moltenOrange)" stroke-width="5" stroke-linecap="round" />
    <path d="M 20 110 L 140 110" stroke="url(#specularChrome)" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

    <!-- Heavy Commercial Tipper Cargo Box -->
    <path d="M 10 25 L 95 25 L 95 90 L 10 90 Z" fill="url(#specularChrome)" />
    <!-- Structural Stiffener Ribs -->
    <line x1="28" y1="30" x2="28" y2="85" stroke="#17232F" stroke-width="3.5" />
    <line x1="50" y1="30" x2="50" y2="85" stroke="#17232F" stroke-width="3.5" />
    <line x1="72" y1="30" x2="72" y2="85" stroke="#17232F" stroke-width="3.5" />

    <!-- Heavy Commercial High-Roof Cab -->
    <path d="M 98 38 L 125 38 L 145 62 L 145 90 L 98 90 Z" fill="url(#specularChrome)" />
    <!-- Sun Visor Deflector -->
    <path d="M 118 33 L 148 52" stroke="url(#moltenOrange)" stroke-width="4" stroke-linecap="round" />
    <!-- Cab Window Glass -->
    <polygon points="103,45 120,45 135,62 103,62" fill="#17232F" />

    <!-- Heavy Axles & Wheels (Tri-Axle / Tandem Set) -->
    <!-- Rear Tandem 1 -->
    <circle cx="32" cy="94" r="14" fill="#0A0F14" stroke="url(#specularChrome)" stroke-width="4" />
    <circle cx="32" cy="94" r="5.5" fill="url(#moltenOrange)" />
    <!-- Rear Tandem 2 -->
    <circle cx="68" cy="94" r="14" fill="#0A0F14" stroke="url(#specularChrome)" stroke-width="4" />
    <circle cx="68" cy="94" r="5.5" fill="url(#moltenOrange)" />
    <!-- Front Steer Axle -->
    <circle cx="126" cy="94" r="14" fill="#0A0F14" stroke="url(#specularChrome)" stroke-width="4" />
    <circle cx="126" cy="94" r="5.5" fill="url(#moltenOrange)" />
  </g>

  <!-- Emblem Arc Text Banner -->
  <g transform="translate(250, 412)" text-anchor="middle">
    <text font-family="'Montserrat', 'Teko', 'Arial Black', sans-serif" font-weight="900" font-size="20" letter-spacing="3" fill="url(#moltenOrange)">
      TRUCK BODY BUILDER
    </text>
  </g>
</svg>